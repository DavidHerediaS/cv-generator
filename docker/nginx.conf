server {
    listen 80;
    server_name mi-generador-cv.com; # <-- Aquí pones tu dominio real

    # Ocultar cabeceras que muestren información del servidor por seguridad
    server_tokens off;

    # 1. Frontend: Todo lo que vaya a la raíz del dominio redirige a React
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Backend: Todas las peticiones que empiecen por /api van a FastAPI
    location /api {
        proxy_pass http://backend:8000/api; # Ajusta si tu API ya incluye /api en sus rutas
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}